<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting to Services | Chandan Sharma</title>
  <meta name="robots" content="noindex" />
  <meta http-equiv="refresh" content="0; url=services.html" />
  <link rel="canonical" href="services.html" />
  <meta name="description" content="This page has moved to services.html." />
  <script>
    (function () {
      try {
        var target = "services.html" + (location.search || "") + (location.hash || "");
        location.replace(target);
      } catch (_e) {
        location.href = "services.html";
      }
    })();
  </script>
</head>
<body>
  <p>If you are not redirected, <a href="services.html">click here to continue to Services</a>.</p>
</body>
</html>
