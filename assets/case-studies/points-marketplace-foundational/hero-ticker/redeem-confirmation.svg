<svg xmlns="http://www.w3.org/2000/svg" width="390" height="400" viewBox="0 408 390 400" role="img" aria-label="Redeem confirmation sheet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171a1f" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#171a1f" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f05b83"/>
      <stop offset="100%" stop-color="#e84a75"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="-4" stdDeviation="16" flood-color="#171a1f" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="0" y="408" width="390" height="400" fill="#ebe8f4"/>
  <rect x="20" y="528" width="350" height="120" rx="20" fill="#5b3fa8" opacity="0.35"/>
  <rect x="0" y="408" width="390" height="400" fill="url(#bg)"/>

  <g filter="url(#sh)">
    <rect x="0" y="420" width="390" height="380" rx="28" fill="#fff"/>
    <rect x="175" y="436" width="40" height="4" rx="2" fill="#d4c4f0"/>

    <circle cx="195" cy="520" r="56" fill="#e8f4fc"/>
    <circle cx="195" cy="512" r="32" fill="#4a9fd4"/>
    <circle cx="185" cy="504" r="10" fill="#2d7ab0"/>
    <path d="M155 548c12-16 48-16 80 0" fill="#2d7ab0" opacity="0.3"/>

    <text x="195" y="600" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#171a1f">Redeem Cyborg?</text>
    <text x="195" y="628" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#4f5866">200 spendable points</text>

    <rect x="24" y="656" width="342" height="72" rx="16" fill="#f6f5f2"/>
    <text x="44" y="684" font-family="system-ui,sans-serif" font-size="13" fill="#4f5866">Your balance after redeem</text>
    <text x="346" y="708" text-anchor="end" font-family="system-ui,sans-serif" font-size="20" font-weight="800" fill="#5b3fa8">40 pts</text>

    <rect x="24" y="748" width="342" height="52" rx="26" fill="url(#cta)"/>
    <text x="195" y="780" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#fff">Confirm redeem</text>
  </g>
</svg>
