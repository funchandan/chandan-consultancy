<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-label="Figma stimulus wireframe: design system frames">
  <rect width="1200" height="960" fill="#f0f0f3"/>
  <text x="80" y="64" font-family="system-ui, sans-serif" font-size="13" fill="#5b3fa8" font-weight="600" letter-spacing="0.1em">FIGMA · DESIGN SYSTEM STIMULUS</text>
  <text x="80" y="100" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#171a1f">Frames for IDIs (DS-aligned)</text>

  <!-- Figma chrome hint -->
  <rect x="80" y="130" width="1040" height="760" rx="12" fill="#1e1e1e"/>
  <rect x="80" y="130" width="200" height="760" fill="#2c2c2c"/>
  <rect x="300" y="130" width="820" height="48" fill="#383838"/>
  <text x="320" y="162" font-family="system-ui, sans-serif" font-size="12" fill="#aaa">points-marketplace-stimulus.fig</text>

  <!-- Three frames -->
  <g transform="translate(320, 210)">
    <rect width="240" height="520" rx="8" fill="#fff" stroke="#5b3fa8" stroke-width="2"/>
    <text x="16" y="36" font-family="system-ui, sans-serif" font-size="11" fill="#5b3fa8" font-weight="600">Frame 01 · Wallet</text>
    <rect x="16" y="52" width="208" height="80" rx="12" fill="#5b3fa8"/>
    <text x="32" y="100" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff">240 pts</text>
    <rect x="16" y="150" width="90" height="90" rx="12" fill="#f0edf6"/>
    <rect x="118" y="150" width="90" height="90" rx="12" fill="#f0edf6"/>
    <rect x="16" y="260" width="208" height="40" rx="10" fill="#f6f4fb"/>
  </g>
  <g transform="translate(580, 210)">
    <rect width="240" height="520" rx="8" fill="#fff" stroke="#8a919c" stroke-width="1"/>
    <text x="16" y="36" font-family="system-ui, sans-serif" font-size="11" fill="#4f5866" font-weight="600">Frame 02 · Avatars</text>
    <rect x="16" y="60" width="70" height="70" rx="10" fill="#e8e0f8"/>
    <rect x="96" y="60" width="70" height="70" rx="10" fill="#e8e0f8"/>
    <rect x="176" y="60" width="48" height="70" rx="10" fill="#e8e0f8"/>
    <rect x="16" y="150" width="208" height="120" rx="12" fill="#f6f4fb"/>
    <text x="32" y="220" font-family="system-ui, sans-serif" font-size="12" fill="#4f5866">Aspiration copy</text>
  </g>
  <g transform="translate(840, 210)">
    <rect width="240" height="520" rx="8" fill="#fff" stroke="#8a919c" stroke-width="1"/>
    <text x="16" y="36" font-family="system-ui, sans-serif" font-size="11" fill="#4f5866" font-weight="600">Frame 03 · Redeem</text>
    <rect x="16" y="80" width="208" height="140" rx="14" fill="#f0edf6"/>
    <rect x="16" y="240" width="208" height="48" rx="24" fill="#5b3fa8"/>
    <text x="120" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#fff" font-weight="600">Spend points</text>
  </g>

  <rect x="320" y="760" width="400" height="88" rx="12" fill="#2c2c2c" stroke="#5b3fa8"/>
  <text x="340" y="792" font-family="system-ui, sans-serif" font-size="12" fill="#c9b8e8">Component set · Button / Card / Balance</text>
  <text x="340" y="818" font-family="system-ui, sans-serif" font-size="11" fill="#8a919c">Tech validation with engineering before ship</text>

  <text x="600" y="930" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8a919c">Study wireframe · role &amp; methodology</text>
</svg>
