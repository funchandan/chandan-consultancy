<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-label="BYJU'S FutureSchool Rewards UI component sheet">
  <defs>
    <linearGradient id="wallet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b4fc4"/>
      <stop offset="100%" stop-color="#5b3fa8"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f05b83"/>
      <stop offset="100%" stop-color="#e84a75"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#5b3fa8" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="1440" height="1024" fill="#f6f5f2"/>
  <text x="48" y="56" font-family="system-ui,sans-serif" font-size="28" font-weight="800" fill="#171a1f">FutureSchool Rewards · UI Kit · Light</text>
  <text x="48" y="84" font-family="system-ui,sans-serif" font-size="14" fill="#4f5866">Portfolio component sheet · single currency · wireframe tokens</text>

  <!-- Colors -->
  <text x="48" y="128" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#5b3fa8" letter-spacing="0.08em">COLORS</text>
  <g transform="translate(48,140)">
    <rect width="80" height="48" rx="8" fill="#5b3fa8"/><text x="0" y="64" font-family="system-ui,sans-serif" font-size="10" fill="#4f5866">#5B3FA8</text>
    <rect x="100" width="80" height="48" rx="8" fill="#f05b83"/><text x="100" y="64" font-family="system-ui,sans-serif" font-size="10" fill="#4f5866">#F05B83</text>
    <rect x="200" width="80" height="48" rx="8" fill="#501c58"/><text x="200" y="64" font-family="system-ui,sans-serif" font-size="10" fill="#4f5866">#501C58</text>
    <rect x="300" width="80" height="48" rx="8" fill="#f0edf6" stroke="#d4c4f0"/><text x="300" y="64" font-family="system-ui,sans-serif" font-size="10" fill="#4f5866">#F0EDF6</text>
    <rect x="400" width="80" height="48" rx="8" fill="#171a1f"/><text x="400" y="64" font-family="system-ui,sans-serif" font-size="10" fill="#4f5866">#171A1F</text>
    <rect x="500" width="80" height="48" rx="8" fill="#f6f5f2" stroke="#d4c4f0"/><text x="500" y="64" font-family="system-ui,sans-serif" font-size="10" fill="#4f5866">#F6F5F2</text>
  </g>

  <!-- Buttons -->
  <text x="48" y="240" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#5b3fa8" letter-spacing="0.08em">BUTTONS</text>
  <rect x="48" y="256" width="140" height="44" rx="22" fill="url(#cta)"/>
  <text x="118" y="284" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#fff">Primary</text>
  <rect x="208" y="256" width="140" height="44" rx="22" fill="#fff" stroke="#5b3fa8" stroke-width="2"/>
  <text x="278" y="284" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#5b3fa8">Secondary</text>
  <text x="368" y="284" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#5b3fa8">Ghost link</text>
  <rect x="488" y="256" width="140" height="44" rx="22" fill="#d4c4f0"/>
  <text x="558" y="284" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#8a919c">Disabled</text>

  <!-- Badges -->
  <text x="48" y="340" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#5b3fa8" letter-spacing="0.08em">BADGES</text>
  <rect x="48" y="356" width="64" height="24" rx="12" fill="#f0edf6"/>
  <text x="80" y="372" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#5b3fa8">200 pts</text>
  <rect x="128" y="356" width="64" height="24" rx="12" fill="#e3eff0"/>
  <text x="160" y="372" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#2f7f85">Owned</text>
  <rect x="208" y="356" width="48" height="24" rx="12" fill="#fde8ef"/>
  <text x="232" y="372" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#f05b83">New</text>
  <rect x="272" y="356" width="64" height="24" rx="12" fill="#f0edf6"/>
  <text x="304" y="372" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#8a919c">Locked</text>

  <!-- Wallet card -->
  <text x="48" y="440" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#5b3fa8" letter-spacing="0.08em">WALLET CARD</text>
  <g filter="url(#sh)">
    <rect x="48" y="456" width="320" height="140" rx="20" fill="url(#wallet)"/>
    <text x="72" y="488" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#e8e0f8" letter-spacing="0.05em">SPENDABLE POINTS</text>
    <text x="72" y="540" font-family="system-ui,sans-serif" font-size="40" font-weight="800" fill="#fff">240</text>
    <text x="72" y="564" font-family="system-ui,sans-serif" font-size="11" fill="#d8cef5">+12 this week</text>
    <rect x="228" y="528" width="120" height="44" rx="22" fill="#fff"/>
    <text x="288" y="556" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#5b3fa8">Redeem now</text>
  </g>

  <!-- Onboarding row -->
  <text x="420" y="440" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#5b3fa8" letter-spacing="0.08em">ONBOARDING ROW</text>
  <g filter="url(#sh)">
    <rect x="420" y="456" width="320" height="56" rx="14" fill="#fff"/>
    <rect x="420" y="456" width="6" height="56" rx="3" fill="#f05b83"/>
    <text x="452" y="480" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#171a1f">How to earn and spend</text>
    <text x="452" y="498" font-family="system-ui,sans-serif" font-size="11" fill="#4f5866">2 min guide before you shop</text>
  </g>

  <!-- Avatar cards -->
  <text x="48" y="640" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#5b3fa8" letter-spacing="0.08em">AVATAR CARDS</text>
  <g transform="translate(48,656)">
    <rect width="140" height="120" rx="16" fill="#fff" stroke="#5b3fa8" stroke-width="2" filter="url(#sh)"/>
    <rect x="12" y="12" width="116" height="64" rx="10" fill="#e8f4fc"/>
    <text x="70" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#171a1f">Selected</text>
    <rect x="160" width="140" height="120" rx="16" fill="#fff" filter="url(#sh)"/>
    <rect x="172" y="12" width="116" height="64" rx="10" fill="#fff3e6"/>
    <text x="230" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#171a1f">Default</text>
    <rect x="320" width="140" height="120" rx="16" fill="#fff" filter="url(#sh)"/>
    <rect x="332" y="12" width="116" height="64" rx="10" fill="#fdeef4"/>
    <text x="390" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#171a1f">Owned</text>
    <rect x="480" width="140" height="120" rx="16" fill="#fff" opacity="0.55" filter="url(#sh)"/>
    <rect x="492" y="12" width="116" height="64" rx="10" fill="#e8f8ee"/>
    <text x="550" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#171a1f">Locked</text>
  </g>

  <!-- Typography -->
  <text x="780" y="240" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#5b3fa8" letter-spacing="0.08em">TYPE</text>
  <text x="780" y="280" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#171a1f">Rewards · 22px</text>
  <text x="780" y="316" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#171a1f">Pick your hero · 16px</text>
  <text x="780" y="348" font-family="system-ui,sans-serif" font-size="14" fill="#171a1f">Body copy · 14px</text>
  <text x="780" y="376" font-family="system-ui,sans-serif" font-size="12" fill="#4f5866">Label · 12px muted</text>
  <text x="780" y="440" font-family="system-ui,sans-serif" font-size="52" font-weight="800" fill="#5b3fa8">240</text>
  <text x="780" y="464" font-family="system-ui,sans-serif" font-size="11" fill="#4f5866">Balance · 52px</text>

  <!-- Toasts -->
  <text x="780" y="520" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#5b3fa8" letter-spacing="0.08em">TOASTS</text>
  <rect x="780" y="536" width="280" height="44" rx="12" fill="#171a1f" opacity="0.88"/>
  <text x="800" y="564" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#fff">Cyborg is yours!</text>
  <rect x="780" y="592" width="280" height="44" rx="12" fill="#fff3e0" stroke="#ffc94d"/>
  <text x="800" y="620" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#5c4400">Not enough points yet</text>

  <!-- Tab bar -->
  <text x="780" y="680" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#5b3fa8" letter-spacing="0.08em">TAB BAR</text>
  <rect x="780" y="696" width="320" height="56" rx="12" fill="#fff" filter="url(#sh)"/>
  <circle cx="820" cy="716" r="4" fill="#c5c9d0"/>
  <circle cx="880" cy="716" r="4" fill="#c5c9d0"/>
  <circle cx="940" cy="716" r="5" fill="#5b3fa8"/>
  <rect x="926" y="724" width="28" height="3" rx="1.5" fill="#5b3fa8"/>
  <circle cx="1000" cy="716" r="4" fill="#c5c9d0"/>
  <circle cx="1060" cy="716" r="4" fill="#c5c9d0"/>
  <text x="820" y="742" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#8a919c">Home</text>
  <text x="940" y="742" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#5b3fa8">Rewards</text>
</svg>
