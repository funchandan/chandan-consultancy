  <text x="182" y="510" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#a03030">Drop</text>

  <text x="150" y="562" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#8a919c">C User journey BYJU #5B3FA8</text>
